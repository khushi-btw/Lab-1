<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Details - BookVerse</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <div class="logo">📚 BookVerse</div>

        <p>Book Information</p>

    </header>


    <main>

        <div class="details-container">

            <h1>📖 Book Details</h1>

            <h2 id="book-title">The Great Gatsby</h2>


            <p>
                <b>✍ Author:</b>
                <span id="book-author">F. Scott Fitzgerald</span>
            </p>


            <p>
                <b>📅 Published:</b>
                <span id="book-year">1925</span>
            </p>


            <p>
                <b>🏷 Genre:</b>
                <span id="book-genre">Fiction</span>
            </p>


            <p>
                <b>📝 Description:</b>
            </p>

            <p id="book-description">
                A story about wealth, love, and the American Dream.
            </p>


            <a class="back-button" href="index.html">
                ← Back to Books
            </a>

        </div>

    </main>


    <footer>

        <p>© 2026 BookVerse | Book Information Website</p>

    </footer>


    <script>

        const params = new URLSearchParams(window.location.search);

        const book = params.get("book");


        const books = {

            gatsby: {

                title: "The Great Gatsby",

                author: "F. Scott Fitzgerald",

                year: "1925",

                genre: "Fiction",

                description:
                    "A story about wealth, love, and the American Dream. The novel explores themes of ambition, love, identity and the pursuit of happiness."

            },


            harry: {

                title: "Harry Potter",

                author: "J.K. Rowling",

                year: "1997",

                genre: "Fantasy",

                description:
                    "A young wizard discovers his magical abilities and begins his journey at Hogwarts, where he makes friends and faces dangerous challenges."

            },


            alchemist: {

                title: "The Alchemist",

                author: "Paulo Coelho",

                year: "1988",

                genre: "Adventure / Fiction",

                description:
                    "A young shepherd named Santiago follows his dreams and travels in search of a hidden treasure while discovering the importance of following one's dreams."

            },


            wings: {

                title: "Wings of Fire",

                author: "A.P.J. Abdul Kalam",

                year: "1999",

                genre: "Autobiography",

                description:
                    "The autobiography of A.P.J. Abdul Kalam describing his childhood, education and journey to becoming a scientist and the President of India."

            }

        };


        if (books[book]) {

            document.getElementById("book-title").textContent =
                books[book].title;

            document.getElementById("book-author").textContent =
                books[book].author;

            document.getElementById("book-year").textContent =
                books[book].year;

            document.getElementById("book-genre").textContent =
                books[book].genre;

            document.getElementById("book-description").textContent =
                books[book].description;

        }

    </script>

</body>

</html>
